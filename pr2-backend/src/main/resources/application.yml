spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: pr2-backend
  profiles:
    default: local

  # Values point at Supabase-hosted Postgres. The URL must include
  # currentSchema=pr2 (and sslmode=require for Supabase).
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: pr2
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PR2_PORT:8080}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.0-flash}

p1:
  ocr-endpoint-url: ${P1_OCR_URL:http://localhost:4000/internal/ocr/extract}

internal:
  api-key: ${INTERNAL_API_KEY:}

# Supabase exposes signing keys at ${SUPABASE_URL}/auth/v1/.well-known/jwks.json.
# Spring resolves this issuer's OpenID metadata and JWKS, then verifies issuer,
# signature, expiry and not-before claims for every user-facing API request.
supabase:
  issuer-uri: ${SUPABASE_ISSUER_URI:${SUPABASE_URL}/auth/v1}
  jwk-set-uri: ${SUPABASE_JWK_SET_URI:${SUPABASE_URL}/auth/v1/.well-known/jwks.json}
