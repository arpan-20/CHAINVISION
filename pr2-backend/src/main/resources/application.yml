server:
  port: ${PR2_PORT:8080}

spring:
  application:
    name: pr2-backend
  profiles:
    default: local

  # Values point at Supabase-hosted Postgres. The URL must include
  # currentSchema=pr2 (and sslmode=require for Supabase).
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: pr2
        dialect: org.hibernate.dialect.PostgreSQLDialect

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.0-flash}
